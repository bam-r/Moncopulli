<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moncopulli - Iniciar sesión</title>
   
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col justify-between min-h-screen">

   
    <header class="w-full bg-white border-b border-gray-100 px-8 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-2">

            <div class="bg-emerald-800 text-white p-1.5 rounded-md font-bold text-sm">🌱</div>
            <span class="font-semibold text-gray-800 text-lg">Moncopulli</span>
        </div>
        <div>
            <a href="#" class="text-sm text-gray-500 hover:text-gray-800 flex items-center gap-1">❓ Ayuda</a>
        </div>
    </header>


    <main class="flex-grow flex items-center justify-center px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
            
            <div class="mb-6">
                <h1 class="text-2xl font-bold text-gray-900 mb-1">Iniciar sesión</h1>
                <p class="text-sm text-gray-500">Ingresa tus datos para acceder a la gestión agrícola de Moncopulli.</p>
            </div>

            <form id="loginForm" class="space-y-5">
                {% csrf_token %}
                
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">RUT</label>
                    <input type="text" id="rut" name="rut" required 
                        placeholder="Ej. 12.345.678-9"
                        class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-700 focus:border-transparent transition">
                    <span class="text-xs text-gray-400 mt-1 block">Incluye el dígito verificador.</span>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider">Contraseña</label>
                        <a href="#" class="text-xs text-emerald-700 hover:underline">¿Olvidaste tu contraseña?</a>
                    </div>
                    <input type="password" id="contrasena" name="contrasena" required 
                        placeholder="Ingresa tu contraseña"
                        class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-700 focus:border-transparent transition">
                </div>

       
                <div id="error-message" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded-lg border border-red-200"></div>

        
                <button type="submit" 
                    class="w-full bg-[#1b4d3e] hover:bg-[#153b30] text-white font-medium py-2.5 rounded-lg transition duration-200 text-sm shadow-md">
                    Iniciar sesión
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-xs text-gray-400">Si no encuentras acceso, contacta al administrador.</p>
            </div>
        </div>
    </main>


    <footer class="w-full text-center py-6 text-xs text-gray-500 border-t border-gray-100">
        <p class="font-medium text-gray-700">Agrícola Moncopulli</p>
        <p class="text-gray-400 mt-0.5">Los Lagos, Chile</p>
    </footer>


    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const rut = document.getElementById('rut').value;
            const contrasena = document.getElementById('contrasena').value;
            const errorDiv = document.getElementById('error-message');
            
            errorDiv.classList.add('hidden');

            try {
                const response = await fetch('/api/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ rut, contrasena })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.menu === 'administrador') {
                        window.location.href = '/admin/'; 
                    } else {
                        window.location.href = '/dashboard/'; 
                    }
                } else {
  
                    errorDiv.textContent = data.error || "Ocurrió un error al iniciar sesión.";
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = "Error de conexión con el servidor.";
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
